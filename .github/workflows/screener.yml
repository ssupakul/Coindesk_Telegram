name: Coindesk to Telegram Crypto Screener

on:
  schedule:
    # รันทุก 1 ชั่วโมง ที่นาทีที่ 30 ของทุกชั่วโมง (เช่น 00:30, 01:30, 02:30 UTC)
    - cron: '30 * * * *'
  workflow_dispatch: # เปิดให้สามารถกดรันเทสเองแบบ Manual ได้

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy

    - name: Run Crypto Screener Script
      env:
        CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python screener.py
      
