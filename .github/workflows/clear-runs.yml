name: Clear Old Workflow Runs

on:
  workflow_dispatch: # เปิดให้คุณสามารถกดสั่งรันแบบแมนนวลผ่านหน้าเว็บได้ตลอดเวลา

jobs:
  clear-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # สำคัญมาก: เพื่อให้สิทธิ์ Workflow นี้ในการลบประวัติรันอื่นๆ

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ใช้ Token อัตโนมัติที่ GitHub มีให้
        run: |
          # ดึงรายการรันล่าสุด 100 รายการ และสั่งลบทีละรายการ
          gh run list --limit 100 --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            echo "Deleting run ID: $run_id"
            gh run delete "$run_id"
          done
