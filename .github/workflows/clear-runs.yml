name: Clear Old Workflow Runs

on:
  workflow_dispatch: 

jobs:
  clear-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write 

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # บรรทัดนี้จะระบุชื่อ Repo ปัจจุบันให้อัตโนมัติ
        run: |
          # ดึงรายการรันล่าสุด 100 รายการ และสั่งลบทีละรายการ
          gh run list --limit 100 --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            echo "Deleting run ID: $run_id"
            gh run delete "$run_id"
          done
